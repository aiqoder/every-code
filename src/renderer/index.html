<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Every Code</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:"
    />
    <script>
      ;(function () {
        var theme = 'github-dark'
        try {
          var stored = localStorage.getItem('everycode.theme')
          if (stored === 'github-dark' || stored === 'github-light' || stored === 'github-dimmed') {
            theme = stored
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'github-light' ? 'light' : 'dark'
      })()
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
