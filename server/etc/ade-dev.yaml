# ADE 本机联调配置。
#
# 用法：
#   cd server && go run ./cmd/server -config etc/ade-dev.yaml
#
# 与 etc/ade.yaml 的唯一差别是 DevAuth：打开后 /api/auth/login 不访问
# user-feedback，直接发放固定令牌，方便在没登记 OAuth 客户端时跑通全流程。
# 部署到任何共享环境前请用 etc/ade.yaml，并保持 DevAuth.Enabled=false。

Name: ade-server
Host: 127.0.0.1
Port: 8183
Timeout: 0
MaxBytes: 33554432

Database:
  Driver: sqlite
  SqlitePath: data/app.db
  MaxIdleConns: 10
  MaxOpenConns: 50
  ConnMaxLifetime: 1h
  LogLevel: warn
  AutoMigrate: true

UserFeedback:
  BaseURL: https://uf.yigechengzi.com
  ClientID: ade-server
  ClientSecret: ""
  RedirectURI: http://127.0.0.1:8183/oauth/callback
  AdminRoleCode: agent_admin
  Timeout: 10s

DevAuth:
  Enabled: true
  UserID: 1
  Username: 本地开发者
  Token: ade-dev-token

ClientAPI:
  InvokeTimeout: 60s
  HeartbeatInterval: 30s

Store:
  StorageDir: data/store
  MaxPackageBytes: 20971520

Skills:
  Dir: skills

# 不装 Redis 也能跑：连不上时自动退回进程内存，重启后需重新上报 catalog。
Redis:
  Addr: 127.0.0.1:6379
  Password: ""
  DB: 1
  CatalogTTL: 90s

Brand:
  Name: ADE
  Logo: ⬢

Cors:
  Enabled: true
  AllowedOrigins: ["*"]
